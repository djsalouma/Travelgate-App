name: travelgate_attendance
description: Cross-platform attendance tracking system for employees based on location.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core dependencies
  cupertino_icons: ^1.0.2
  
  # State management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^13.0.0
  
  # Local storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  
  # Location services
  geolocator: ^10.0.0
  geofencing: ^1.0.0
  permission_handler: ^11.1.0
  
  # Date and time handling
  intl: ^0.18.1
  date_format: ^2.0.7
  
  # UI Components
  flutter_svg: ^2.0.7
  flutter_spinkit: ^5.2.0
  lottie: ^2.7.0
  
  # Forms and validation
  flutter_form_builder: ^7.7.0
  form_builder_validators: ^9.0.0
  
  # Charts and reports
  syncfusion_flutter_charts: ^24.1.45
  
  # Excel export
  excel: ^2.0.1
  
  # PDF generation (optional)
  printing: ^5.11.1
  pdf: ^3.10.7
  
  # Networking
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  
  # Authentication (for admin)
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  
  # Notifications
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
